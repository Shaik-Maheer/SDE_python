[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "Upload Shapefiles or KML and calculate metric feature measurements."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "geopandas==1.0.1",
  "pyogrio==0.10.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
